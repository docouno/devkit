name: Prepare native author SDK
description: Restore architecture-scoped caches and run the pinned author bootstrap
inputs:
  mode:
    required: true
    description: Full author setup or Rust-only bootstrap
runs:
  using: composite
  steps:
    - name: Cache verified pnpm executable
      if: inputs.mode == 'full'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/docouno/devkit/tools
        key: pnpm-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.env') }}
    - name: Cache author pnpm store
      if: inputs.mode == 'full'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .artifacts/author/pnpm-store
        key: author-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'toolchains.env') }}
    - name: Cache author Cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .artifacts/author/cargo-home/registry/index
          .artifacts/author/cargo-home/registry/cache
          .artifacts/author/cargo-home/git/db
        key: author-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'toolchains.env') }}
    - name: Cache author Rust SDK image
      id: author_rust_cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .artifacts/cache/author-rust-image.tar
        key: author-rust-img-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/native.Dockerfile') }}
    - name: Load cached author Rust SDK image
      if: steps.author_rust_cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        recipe_sha=$(sha256sum tooling/native.Dockerfile | cut -d ' ' -f 1)
        docker load --input .artifacts/cache/author-rust-image.tar
        docker image inspect "devkit-author-rust:$recipe_sha" >/dev/null
    - name: Prepare pinned author SDKs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          full) make setup ;;
          bootstrap) make bootstrap ;;
          *) exit 1 ;;
        esac
    - name: Stage author Rust SDK image for cache
      if: steps.author_rust_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        umask 022
        recipe_sha=$(sha256sum tooling/native.Dockerfile | cut -d ' ' -f 1)
        mkdir -p .artifacts/cache
        docker save --output .artifacts/cache/author-rust-image.tar "devkit-author-rust:$recipe_sha"
