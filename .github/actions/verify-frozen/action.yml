name: Admit the frozen verification input
description: Restore one attributed distribution set and the genuine baseline without rebuilding consumer bytes
inputs:
  version:
    required: true
    description: Frozen version
  source_commit:
    required: true
    description: Frozen source commit
  source_tree:
    required: true
    description: Frozen source tree
  index_sha256:
    required: true
    description: SHA256 of the original raw release index
  platform:
    required: true
    description: Native Linux daemon architecture (amd64 or arm64)
  need_baseline:
    required: true
    description: Restore the genuine x86-64 baseline
  frozen_set_artifact:
    required: true
    description: Exact successful assembly artifact name
  controller_artifact:
    required: true
    description: Exact native producer controller artifact name
  controller_sha256:
    required: true
    description: Expected native controller identity before execution
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-compose
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: ${{ inputs.frozen_set_artifact }}
        path: .artifacts/frozen
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: ${{ inputs.controller_artifact }}
        path: .artifacts/release-ops
    - name: Verify identities and hydrate the original archive
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        CONTROLLER_SHA256: ${{ inputs.controller_sha256 }}
        VERSION: ${{ inputs.version }}
        SOURCE_COMMIT: ${{ inputs.source_commit }}
        SOURCE_TREE: ${{ inputs.source_tree }}
        INDEX_SHA256: ${{ inputs.index_sha256 }}
      run: |
        set -euo pipefail
        case "$PLATFORM:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1;; esac
        test "$(sha256sum .artifacts/release-ops/devkit-release | cut -d ' ' -f 1)" = "$CONTROLLER_SHA256"
        test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        test "$(sha256sum .artifacts/frozen/release-index.json | cut -d ' ' -f 1)" = "$INDEX_SHA256"
        chmod 755 .artifacts/release-ops/devkit-release
        jq -er '.engines[]' .artifacts/frozen/release-index.json | while IFS= read -r engine; do
          chmod 755 ".artifacts/frozen/$engine"
        done
        .artifacts/release-ops/devkit-release hydrate --root "$PWD" --version "$VERSION" \
          --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" --build-set "$PWD/.artifacts/frozen"
    - uses: ./.github/actions/restore-baseline
      if: inputs.need_baseline == 'true'
