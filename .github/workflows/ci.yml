name: Source and packaged consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-linux-amd64:
    uses: ./.github/workflows/source-linux.yml
    with:
      platform: amd64
      source_commit: ${{ github.sha }}

  source-linux-arm64:
    uses: ./.github/workflows/source-linux.yml
    with:
      platform: arm64
      source_commit: ${{ github.sha }}

  build-linux-amd64:
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: amd64
      source_commit: ${{ github.sha }}
      fresh: true

  build-linux-arm64:
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: arm64
      source_commit: ${{ github.sha }}
      fresh: true

  build-darwin-arm64:
    uses: ./.github/workflows/build-darwin.yml
    with:
      source_commit: ${{ github.sha }}
      fresh: true

  assemble:
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    uses: ./.github/workflows/assemble.yml
    with:
      source_commit: ${{ github.sha }}
      state: fresh
      amd64: ${{ toJSON(needs.build-linux-amd64.outputs) }}
      arm64: ${{ toJSON(needs.build-linux-arm64.outputs) }}
      darwin: ${{ toJSON(needs.build-darwin-arm64.outputs) }}

  verify:
    needs: [assemble, build-linux-amd64, build-linux-arm64, source-linux-amd64, source-linux-arm64]
    if: '!cancelled()'
    uses: ./.github/workflows/verify.yml
    with:
      state: fresh
      assembly_result: ${{ needs.assemble.result }}
      source_amd64_result: ${{ needs.source-linux-amd64.result }}
      source_arm64_result: ${{ needs.source-linux-arm64.result }}
      frozen: ${{ toJSON(needs.assemble.outputs) }}
      amd64: ${{ toJSON(needs.build-linux-amd64.outputs) }}
      arm64: ${{ toJSON(needs.build-linux-arm64.outputs) }}
