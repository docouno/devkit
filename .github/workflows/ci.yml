name: Source and packaged consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.freeze.outputs.version }}
      source_commit: ${{ steps.freeze.outputs.source_commit }}
      source_tree: ${{ steps.freeze.outputs.source_tree }}
      index_sha256: ${{ steps.freeze.outputs.index_sha256 }}
      artifact_suffix: ${{ steps.freeze.outputs.artifact_suffix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source admission and performance failure guards
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/public -p test_release_guard.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/performance -p 'test_*.py'
      - uses: ./.github/actions/setup-compose
      - name: Prepare pinned author SDKs
        run: make setup
      - name: Build the author-only controller
        run: make build-controller
      - name: Assemble one frozen test set from clean source
        env:
          BUILD_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: make pack output="$PWD/.artifacts/frozen" build_id=ci build_run="$BUILD_RUN"
      - name: Freeze handoff identities
        id: freeze
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          raw = Path('.artifacts/frozen/release-index.json').read_bytes()
          index = json.loads(raw)
          assert index['publicationEligible'] is True
          assert index['sourceCommit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert index['sourceTree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in (('version', index['version']), ('source_commit', index['sourceCommit']), ('source_tree', index['sourceTree']), ('index_sha256', hashlib.sha256(raw).hexdigest()), ('artifact_suffix', os.environ['GITHUB_RUN_ATTEMPT'])):
                  output.write(key + '=' + value + '\n')
          PY
      - name: Preserve every frozen distribution file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devkit-frozen-set-${{ github.run_attempt }}
          path: |
            .artifacts/frozen/*.json
            .artifacts/frozen/*.tgz
            .artifacts/frozen/*.tar.gz
            .artifacts/frozen/*.sh
            .artifacts/frozen/*.txt
            .artifacts/frozen/devkit-x86_64-unknown-linux-musl
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devkit-release-controller-${{ github.run_attempt }}
          path: .artifacts/release-ops/devkit-release
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-build-diagnostics-${{ github.run_attempt }}
          path: |
            .artifacts/**/*.log
            .artifacts/author/*notice-producer.json
          retention-days: 14
          if-no-files-found: warn

  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_commit: ${{ needs.prepare.outputs.source_commit }}
      source_tree: ${{ needs.prepare.outputs.source_tree }}
      index_sha256: ${{ needs.prepare.outputs.index_sha256 }}
      artifact_suffix: ${{ needs.prepare.outputs.artifact_suffix }}
