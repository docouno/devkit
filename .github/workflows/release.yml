name: Release frozen native artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version already coordinated in reviewed main
        required: true
        type: string
      source_commit:
        description: Exact dispatch event commit; retry historical releases through their original run
        required: true
        type: string
      previous_env:
        description: Expected previous stable @docouno/env latest; bootstrap new names separately
        required: true
        type: string
      previous_cli:
        description: Expected previous stable @docouno/devkit latest; stage placeholders are not a baseline
        required: true
        type: string
      previous_github:
        description: Expected previous GitHub latest tag (or none)
        required: true
        type: string

# Every publish and promotion shares this queue, including reruns and versions.
# No PR workflow receives OIDC or write authority.
permissions:
  contents: read
  actions: read

concurrency:
  group: devkit-publication-and-promotion
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  PREVIOUS_ENV: ${{ inputs.previous_env }}
  PREVIOUS_CLI: ${{ inputs.previous_cli }}
  PREVIOUS_GITHUB: ${{ inputs.previous_github }}
  BUILD_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

jobs:
  admit-and-inspect:
    if: github.repository == 'docouno/devkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      state: ${{ steps.inspect.outputs.state }}
      original_run_id: ${{ steps.inspect.outputs.original_run_id }}
      original_attempt: ${{ steps.inspect.outputs.original_attempt }}
      expected_index_sha256: ${{ steps.inspect.outputs.expected_index_sha256 }}
      restored_frozen_artifact: ${{ steps.inspect.outputs.restored_frozen_artifact }}
    steps:
      - name: Admit reviewed main source before executing checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          sha = os.environ['SOURCE_COMMIT']
          assert re.fullmatch('[a-f0-9]{40}', sha), 'Exact lowercase source SHA required'
          assert os.environ.get('GITHUB_SHA') == sha, 'SOURCE_COMMIT must equal the authentic event GITHUB_SHA for npm provenance. Retry a historical release using gh run rerun ORIGINAL_RUN_ID --failed; do not dispatch it at a newer commit.'
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', os.environ['VERSION']), 'Exact stable version required'
          def api(path):
              return json.loads(subprocess.run(['gh', 'api', path], check=True, capture_output=True, text=True, timeout=90).stdout)
          assert api('repos/docouno/devkit')['default_branch'] == 'main', 'Reviewed release branch must be main'
          comparison = api(f'repos/docouno/devkit/compare/{sha}...main')
          assert comparison['status'] in ('identical', 'ahead'), 'Source must be reviewed main or its ancestor'
          PY
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source admission and performance failure guards
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/public -p test_release_guard.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/performance -p 'test_*.py'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: ./.github/actions/author-sdk
        with:
          mode: bootstrap
      - name: Build release inspector
        run: make build-controller
      - name: Inspect original durable bytes before any candidate build
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tree=$(env -i PATH="$PATH" git rev-parse 'HEAD^{tree}')
          .artifacts/release-ops/devkit-release inspect --root "$PWD" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$source_tree" \
            --previous-env "$PREVIOUS_ENV" --previous-cli "$PREVIOUS_CLI" --previous-github "$PREVIOUS_GITHUB" \
            --output "$PWD/.artifacts/frozen" > .artifacts/release-ops/inspection.json
          python3 - <<'PYTHON'
          import json, os
          with open('.artifacts/release-ops/inspection.json') as f:
              inspected = json.load(f)
          state = inspected['state']
          assert state in ('fresh', 'restored', 'incomplete')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('state=' + state, file=output)
              if state != 'fresh':
                  print('original_run_id=' + str(inspected['originalRunId']), file=output)
                  print('original_attempt=' + str(inspected['originalAttempt']), file=output)
                  print('expected_index_sha256=' + inspected['contract']['indexSha256'], file=output)
              if state == 'restored':
                  print('restored_frozen_artifact=devkit-restored-' + os.environ['GITHUB_RUN_ATTEMPT'], file=output)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.inspect.outputs.state == 'restored'
        with:
          include-hidden-files: true
          name: ${{ steps.inspect.outputs.restored_frozen_artifact }}
          path: |
            .artifacts/frozen/*.json
            .artifacts/frozen/*.tgz
            .artifacts/frozen/*.tar.gz
            .artifacts/frozen/*.sh
            .artifacts/frozen/*.txt
            .artifacts/frozen/devkit-*
          if-no-files-found: error
          retention-days: 90

  source-linux-amd64:
    needs: admit-and-inspect
    uses: ./.github/workflows/source-linux.yml
    with:
      platform: amd64
      source_commit: ${{ inputs.source_commit }}

  source-linux-arm64:
    needs: admit-and-inspect
    uses: ./.github/workflows/source-linux.yml
    with:
      platform: arm64
      source_commit: ${{ inputs.source_commit }}

  build-linux-amd64:
    needs: admit-and-inspect
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: amd64
      source_commit: ${{ inputs.source_commit }}
      fresh: ${{ needs.admit-and-inspect.outputs.state == 'fresh' }}

  build-linux-arm64:
    needs: admit-and-inspect
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: arm64
      source_commit: ${{ inputs.source_commit }}
      fresh: ${{ needs.admit-and-inspect.outputs.state == 'fresh' }}

  build-darwin-arm64:
    needs: admit-and-inspect
    uses: ./.github/workflows/build-darwin.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      fresh: ${{ needs.admit-and-inspect.outputs.state == 'fresh' }}

  assemble:
    needs: [admit-and-inspect, build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    uses: ./.github/workflows/assemble.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      state: ${{ needs.admit-and-inspect.outputs.state }}
      version: ${{ inputs.version }}
      original_run_id: ${{ needs.admit-and-inspect.outputs.original_run_id }}
      original_attempt: ${{ needs.admit-and-inspect.outputs.original_attempt }}
      expected_index_sha256: ${{ needs.admit-and-inspect.outputs.expected_index_sha256 }}
      restored_frozen_artifact: ${{ needs.admit-and-inspect.outputs.restored_frozen_artifact }}
      amd64: ${{ toJSON(needs.build-linux-amd64.outputs) }}
      arm64: ${{ toJSON(needs.build-linux-arm64.outputs) }}
      darwin: ${{ toJSON(needs.build-darwin-arm64.outputs) }}

  verify:
    needs:
      [
        admit-and-inspect,
        assemble,
        build-linux-amd64,
        build-linux-arm64,
        source-linux-amd64,
        source-linux-arm64,
      ]
    uses: ./.github/workflows/verify.yml
    with:
      state: ${{ needs.admit-and-inspect.outputs.state }}
      assembly_result: ${{ needs.assemble.result }}
      source_amd64_result: ${{ needs.source-linux-amd64.result }}
      source_arm64_result: ${{ needs.source-linux-arm64.result }}
      frozen: ${{ toJSON(needs.assemble.outputs) }}
      amd64: ${{ toJSON(needs.build-linux-amd64.outputs) }}
      arm64: ${{ toJSON(needs.build-linux-arm64.outputs) }}
      run_performance: true

  publish:
    needs: [assemble, build-linux-amd64, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
    env:
      CONTROLLER_SHA256: ${{ needs.build-linux-amd64.outputs.controller_sha256 }}
      SOURCE_TREE: ${{ needs.assemble.outputs.source_tree }}
      INDEX_SHA256: ${{ needs.assemble.outputs.index_sha256 }}
      PERFORMANCE_SHA256: ${{ needs.verify.outputs.performance_sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-compose
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.assemble.outputs.frozen_set_artifact }}
          path: .artifacts/frozen
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.build-linux-amd64.outputs.controller_artifact }}
          path: .artifacts/release-ops
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.verify.outputs.performance_artifact }}
          path: .artifacts/release-proof
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install the exact publisher into this runner's temporary prefix
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/npm-publisher" --ignore-scripts --no-audit --no-fund npm@11.21.1
          printf '%s\n' "$RUNNER_TEMP/npm-publisher/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify frozen handoff and stage all bytes in GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sha256sum .artifacts/frozen/release-index.json | cut -d ' ' -f 1)" = "$INDEX_SHA256"
          test "$(sha256sum .artifacts/release-ops/devkit-release | cut -d ' ' -f 1)" = "$CONTROLLER_SHA256"
          test "$(sha256sum .artifacts/release-proof/performance.json | cut -d ' ' -f 1)" = "$PERFORMANCE_SHA256"
          chmod 755 .artifacts/release-ops/devkit-release
          jq -er '.engines[]' .artifacts/frozen/release-index.json | while IFS= read -r engine; do
            chmod 755 ".artifacts/frozen/$engine"
          done
          args=(--root "$PWD" --version "$VERSION" --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" --previous-env "$PREVIOUS_ENV" --previous-cli "$PREVIOUS_CLI" --previous-github "$PREVIOUS_GITHUB" --build-set "$PWD/.artifacts/frozen")
          .artifacts/release-ops/devkit-release hydrate "${args[@]}"
          .artifacts/release-ops/devkit-release stage "${args[@]}"
      - name: Publish exact npm archives with OIDC and complete immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .artifacts/release-ops/devkit-release publish --root "$PWD" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" \
            --previous-env "$PREVIOUS_ENV" --previous-cli "$PREVIOUS_CLI" --previous-github "$PREVIOUS_GITHUB" \
            --build-set "$PWD/.artifacts/frozen"
      - name: Prepare only the public consumer Node image
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          pins = dict(line.split('=', 1) for line in Path('toolchains.env').read_text().splitlines() if line and not line.startswith('#'))
          subprocess.run(['docker', 'pull', pins['DEVKIT_NODE_IMAGE']], check=True, timeout=180)
          PY
      - name: Anonymous public baseline full migration matrix
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile
          from pathlib import Path
          root = Path.cwd()
          proof = root / '.artifacts/release-proof'
          proof.mkdir(parents=True, exist_ok=True)
          # No Actions/npm credentials enter the actual public consumer process.
          environment = {key: os.environ[key] for key in ('PATH', 'LANG', 'LC_ALL') if key in os.environ}
          environment.update(HOME=tempfile.mkdtemp(prefix='devkit-anonymous-'), CI='true')
          subprocess.run([
              'python3', 'test/public/verify.py',
              '--version', os.environ['PREVIOUS_CLI'],
              '--next-version', os.environ['VERSION'],
              '--expected-index-sha256', os.environ['INDEX_SHA256'],
              '--output', str(proof / 'public-baseline.json'),
          ], check=True, env=environment, timeout=3600)
          PY
      - name: Anonymous public pinned npx and README entry checks
        run: python3 test/public/npx.py --build-set "$PWD/.artifacts/frozen" --output "$PWD/.artifacts/release-proof/npx-pinned.json" --transport-output "$PWD/.artifacts/release-proof/transport-cold.json"
      - name: Execute the actual principal README project flow
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path.cwd()
          command = ['python3', 'test/public/readme.py', '--build-set', str(root / '.artifacts/frozen'), '--output', str(root / '.artifacts/release-proof/readme.json')]
          previous = os.environ['PREVIOUS_ENV']
          if tuple(map(int, previous.split('.'))) >= (0, 5, 0):
              command += ['--previous-native', previous]
          subprocess.run(command, check=True, timeout=3600)
          PY
      - name: Persist compact public proof before changing selectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .artifacts/release-ops/devkit-release record-proof --root "$PWD" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" \
            --previous-env "$PREVIOUS_ENV" --previous-cli "$PREVIOUS_CLI" --previous-github "$PREVIOUS_GITHUB" \
            --build-set "$PWD/.artifacts/frozen" --publication-run "$BUILD_RUN" \
            --public-baseline "$PWD/.artifacts/release-proof/public-baseline.json" \
            --npx "$PWD/.artifacts/release-proof/npx-pinned.json" \
            --performance "$PWD/.artifacts/release-proof/performance.json" \
            --transport "$PWD/.artifacts/release-proof/transport-cold.json" \
            --readme "$PWD/.artifacts/release-proof/readme.json" \
            --output "$PWD/.artifacts/release-proof/compact.json"
      - name: Promote only after all actual public gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .artifacts/release-ops/devkit-release promote --root "$PWD" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" \
            --previous-env "$PREVIOUS_ENV" --previous-cli "$PREVIOUS_CLI" --previous-github "$PREVIOUS_GITHUB" \
            --build-set "$PWD/.artifacts/frozen"
      - name: Verify the newly promoted unqualified public npx selector
        run: python3 test/public/npx.py --build-set "$PWD/.artifacts/frozen" --selector-mode latest --output "$PWD/.artifacts/release-proof/npx-latest.json"
      - name: Persist the actual unqualified selector result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .artifacts/release-ops/devkit-release record-latest --root "$PWD" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" \
            --previous-env "$PREVIOUS_ENV" --previous-cli "$PREVIOUS_CLI" --previous-github "$PREVIOUS_GITHUB" \
            --build-set "$PWD/.artifacts/frozen" --npx "$PWD/.artifacts/release-proof/npx-latest.json"
      - name: Preserve full public receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: release-public-verification-${{ github.run_attempt }}
          path: |
            .artifacts/release-proof/
            .artifacts/public/
            .artifacts/packaged/
            .artifacts/release-ops/*.json
          retention-days: 90
          if-no-files-found: warn
