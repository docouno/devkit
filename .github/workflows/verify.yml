name: Verify one frozen set

on:
  workflow_call:
    inputs:
      assembly_result:
        required: true
        type: string
      state:
        required: true
        type: string
      frozen:
        required: true
        type: string
      amd64:
        required: true
        type: string
      arm64:
        required: true
        type: string
      run_performance:
        default: false
        type: boolean
    outputs:
      performance_artifact:
        description: Artifact from the successful isolated performance job, including its original attempt
        value: ${{ jobs.performance.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the completed assembly handoff
        env:
          ASSEMBLY_RESULT: ${{ inputs.assembly_result }}
          STATE: ${{ inputs.state }}
          FROZEN: ${{ inputs.frozen }}
        run: |
          set -euo pipefail
          test "$ASSEMBLY_RESULT" = success || { echo "Assembly result was $ASSEMBLY_RESULT" >&2; exit 1; }
          jq -e --arg state "$STATE" '
            (.frozen_set_artifact | capture("^devkit-frozen-set-(?<attempt>[1-9][0-9]*)\\z").attempt) as $attempt |
            (.version | type == "string" and length > 0) and
            (.source_commit | test("^[0-9a-f]{40}\\z")) and (.source_tree | test("^[0-9a-f]{40}\\z")) and
            (.index_sha256 | test("^[0-9a-f]{64}\\z")) and
            (if $state == "fresh" then
               .preview_artifact == ("devkit-darwin-preview-" + $attempt) and
               (.preview_index_sha256 | test("^[0-9a-f]{64}\\z"))
             else $state == "restored" or $state == "incomplete" end)
          ' <<< "$FROZEN" || { echo "Invalid frozen or preview identity for state $STATE" >&2; exit 1; }

  source-linux-amd64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: source
      platform: amd64
      native: ${{ inputs.amd64 }}

  source-linux-arm64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: source
      platform: arm64
      native: ${{ inputs.arm64 }}

  source:
    name: source
    if: always()
    needs: [handoff, source-linux-amd64, source-linux-arm64, darwin-host]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native verification worker to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  runtime-linux-amd64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: runtime
      platform: amd64
      native: ${{ inputs.amd64 }}

  runtime-linux-arm64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: runtime
      platform: arm64
      native: ${{ inputs.arm64 }}

  runtime:
    name: runtime
    if: always()
    needs: [handoff, runtime-linux-amd64, runtime-linux-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native verification worker to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  delivery-linux-amd64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: delivery
      platform: amd64
      native: ${{ inputs.amd64 }}

  delivery-linux-arm64:
    needs: source-linux-amd64
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: delivery
      platform: arm64
      native: ${{ inputs.arm64 }}
      legacy_checkout_artifact: ${{ needs.source-linux-amd64.outputs.legacy_checkout_artifact }}

  delivery:
    name: delivery
    if: always()
    needs: [handoff, delivery-linux-amd64, delivery-linux-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native verification worker to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  packaged-linux-amd64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: packaged
      platform: amd64
      native: ${{ inputs.amd64 }}

  packaged-linux-arm64:
    needs: packaged-linux-amd64
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: packaged
      platform: arm64
      native: ${{ inputs.arm64 }}
      checkout_artifact: ${{ needs.packaged-linux-amd64.outputs.checkout_artifact }}

  packaged:
    name: packaged
    if: always()
    needs: [handoff, packaged-linux-amd64, packaged-linux-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native verification worker to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  registry-linux-amd64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: registry
      platform: amd64
      native: ${{ inputs.amd64 }}

  registry-linux-arm64:
    needs: handoff
    uses: ./.github/workflows/verify-group.yml
    with:
      frozen: ${{ inputs.frozen }}
      group: registry
      platform: arm64
      native: ${{ inputs.arm64 }}

  registry:
    name: registry
    if: always()
    needs: [handoff, registry-linux-amd64, registry-linux-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native verification worker to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  darwin-host:
    needs: source-linux-amd64
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PREVIEW_ARTIFACT: ${{ fromJSON(inputs.frozen).preview_artifact }}
      PREVIEW_SHA256: ${{ fromJSON(inputs.frozen).preview_index_sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ fromJSON(inputs.frozen).source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'fresh'
        with:
          name: ${{ env.PREVIEW_ARTIFACT }}
          path: .artifacts/preview
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'fresh'
        with:
          name: ${{ needs.source-linux-amd64.outputs.legacy_checkout_artifact }}
          path: .artifacts/legacy-handoff
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        if: inputs.state == 'fresh'
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify the unpublished native package, bootstrap and checkout
        if: inputs.state == 'fresh'
        run: |
          set -euo pipefail
          dir="$PWD/.artifacts/preview"
          test "$(shasum -a 256 "$dir/release-index.json" | cut -d ' ' -f 1)" = "$PREVIEW_SHA256"
          archive=$(jq -er '.archive' "$dir/release-index.json")
          test "$(shasum -a 256 "$dir/$archive" | cut -d ' ' -f 1)" = "$(jq -er --arg name "$archive" '.files[$name].sha256' "$dir/release-index.json")"
          chmod 755 "$dir"/devkit-*-{musl,darwin} "$dir"/{install,bootstrap}.sh
          mkdir "$dir/payload"
          tar -xzf "$dir/$archive" --strip-components=1 -C "$dir/payload"
          python3 test/darwin/verify.py --build-set "$dir"
          python3 test/bootstrap/legacy_checkout.py verify --release "$dir/payload" --bundle .artifacts/legacy-handoff/legacy.bundle
      - name: Verify stock host entry points for a restored Linux release
        if: inputs.state == 'restored' || inputs.state == 'incomplete'
        run: python3 test/bootstrap/portable.py

  performance:
    needs: handoff
    if: inputs.run_performance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.receipt.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ fromJSON(inputs.frozen).source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/verify-frozen
        with:
          version: ${{ fromJSON(inputs.frozen).version }}
          source_commit: ${{ fromJSON(inputs.frozen).source_commit }}
          source_tree: ${{ fromJSON(inputs.frozen).source_tree }}
          index_sha256: ${{ fromJSON(inputs.frozen).index_sha256 }}
          frozen_set_artifact: ${{ fromJSON(inputs.frozen).frozen_set_artifact }}
          platform: amd64
          need_baseline: 'true'
          controller_artifact: ${{ fromJSON(inputs.amd64).controller_artifact }}
          controller_sha256: ${{ fromJSON(inputs.amd64).controller_sha256 }}
      - name: Cache author Rust trace image
        id: author_rust_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .artifacts/cache/author-rust-image.tar
          key: author-rust-img-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/native.Dockerfile') }}
      - name: Prepare author Rust trace image
        env:
          CACHE_HIT: ${{ steps.author_rust_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          umask 022
          recipe_sha=$(sha256sum tooling/native.Dockerfile | cut -d ' ' -f 1)
          if test "$CACHE_HIT" = true; then
            docker load --input .artifacts/cache/author-rust-image.tar
            docker image inspect "devkit-author-rust:$recipe_sha" >/dev/null
          else
            docker build --tag "devkit-author-rust:$recipe_sha" - < tooling/native.Dockerfile
            mkdir -p .artifacts/cache
            docker save --output .artifacts/cache/author-rust-image.tar "devkit-author-rust:$recipe_sha"
          fi
      - name: Measure all R14 shapes and samples on this isolated runner
        run: |
          set -euo pipefail
          recipe_sha=$(sha256sum tooling/native.Dockerfile | cut -d ' ' -f 1)
          export DEVKIT_PERFORMANCE_TRACE_IMAGE
          DEVKIT_PERFORMANCE_TRACE_IMAGE=$(docker image inspect --format '{{.Id}}' "devkit-author-rust:$recipe_sha")
          python3 test/performance/verify.py --build-set "$PWD/.artifacts/frozen" --baseline-release "$PWD/.artifacts/baseline/v0.5.1/payload" --output "$PWD/.artifacts/release-ops/performance.json"
      - name: Preserve the exact successful performance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: devkit-performance-${{ github.run_attempt }}
          path: .artifacts/release-ops/performance.json
          if-no-files-found: error
          retention-days: 90
      - name: Identify this successful performance artifact for failed-only reruns
        id: receipt
        run: printf 'artifact_name=devkit-performance-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Preserve performance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: verify-performance-diagnostics-${{ github.run_attempt }}
          path: |
            .artifacts/**/receipt.json
            .artifacts/**/*.log
            .artifacts/release-ops/performance.json
          retention-days: 90
          if-no-files-found: warn
