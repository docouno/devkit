name: Assemble or restore one frozen set

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      state:
        required: true
        type: string
      darwin:
        required: true
        type: string
      amd64:
        required: true
        type: string
      arm64:
        required: true
        type: string
      expected_index_sha256:
        required: false
        type: string
      original_run_id:
        required: false
        type: string
      original_attempt:
        required: false
        type: string
      restored_frozen_artifact:
        required: false
        type: string
      version:
        required: false
        type: string
    outputs:
      preview_artifact:
        description: Preview artifact
        value: ${{ jobs.assemble.outputs.preview_artifact }}
      preview_index_sha256:
        description: Preview index sha256
        value: ${{ jobs.assemble.outputs.preview_index_sha256 }}
      version:
        description: Version
        value: ${{ jobs.assemble.outputs.version }}
      source_commit:
        description: Source commit
        value: ${{ jobs.assemble.outputs.source_commit }}
      source_tree:
        description: Source tree
        value: ${{ jobs.assemble.outputs.source_tree }}
      index_sha256:
        description: Index sha256
        value: ${{ jobs.assemble.outputs.index_sha256 }}
      frozen_set_artifact:
        description: Frozen set artifact
        value: ${{ jobs.assemble.outputs.frozen_set_artifact }}

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.freeze.outputs.version }}
      source_commit: ${{ steps.freeze.outputs.source_commit }}
      source_tree: ${{ steps.freeze.outputs.source_tree }}
      index_sha256: ${{ steps.freeze.outputs.index_sha256 }}
      frozen_set_artifact: ${{ steps.freeze.outputs.frozen_set_artifact }}
      preview_artifact: ${{ steps.preview.outputs.preview_artifact }}
      preview_index_sha256: ${{ steps.preview.outputs.preview_index_sha256 }}
    env:
      EXPECTED_INDEX: ${{ inputs.expected_index_sha256 }}
      VERSION: ${{ inputs.version }}
      BUILD_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'fresh'
        with:
          name: ${{ fromJSON(inputs.amd64).contribution_artifact }}
          path: .artifacts/amd64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'fresh'
        with:
          name: ${{ fromJSON(inputs.arm64).contribution_artifact }}
          path: .artifacts/arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'fresh'
        with:
          name: ${{ fromJSON(inputs.amd64).npm_inputs_artifact }}
          path: .artifacts/npm-inputs
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'fresh'
        with:
          name: ${{ fromJSON(inputs.darwin).contribution_artifact }}
          path: .artifacts/darwin
      - name: Verify downloaded producer identities
        if: inputs.state == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
          AMD64: ${{ inputs.amd64 }}
          DARWIN: ${{ inputs.darwin }}
          ARM64: ${{ inputs.arm64 }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-contributions.py
      - name: Assemble verified Linux contributions
        if: inputs.state == 'fresh'
        env:
          AMD64: ${{ fromJSON(inputs.amd64).contribution_sha256 }}
          ARM64: ${{ fromJSON(inputs.arm64).contribution_sha256 }}
        run: |
          set -euo pipefail
          img=$(sed -n 's/^DEVKIT_NODE_IMAGE=//p' toolchains.env)
          docker pull "$img"
          export DEVKIT_AUTHOR_ENGINE="$PWD/.artifacts/amd64/devkit-x86_64-unknown-linux-musl"
          make pack output="$PWD/.artifacts/frozen" npm_inputs="$PWD/.artifacts/npm-inputs" \
            target_inputs="x86_64-unknown-linux-musl:.artifacts/amd64:$AMD64 aarch64-unknown-linux-musl:.artifacts/arm64:$ARM64" build_run="$BUILD_RUN"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state == 'restored'
        with:
          name: ${{ inputs.restored_frozen_artifact }}
          path: .artifacts/frozen
      - name: Recover the original artifact from an interrupted draft
        if: inputs.state == 'incomplete'
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_ATTEMPT: ${{ inputs.original_attempt }}
        run: gh run download "$ORIGINAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "devkit-frozen-set-$ORIGINAL_ATTEMPT" --dir "$PWD/.artifacts/frozen"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.state != 'fresh'
        with:
          name: ${{ fromJSON(inputs.amd64).controller_artifact }}
          path: .artifacts/release-ops
      - name: Verify restored bytes against original draft attribution
        if: inputs.state != 'fresh'
        env:
          CONTROLLER_SHA256: ${{ fromJSON(inputs.amd64).controller_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum .artifacts/frozen/release-index.json | cut -d ' ' -f 1)" = "$EXPECTED_INDEX"
          test "$(sha256sum .artifacts/release-ops/devkit-release | cut -d ' ' -f 1)" = "$CONTROLLER_SHA256"
          chmod 755 .artifacts/release-ops/devkit-release .artifacts/frozen/devkit-*-unknown-linux-musl
          .artifacts/release-ops/devkit-release hydrate --root "$PWD" --version "$VERSION" \
            --source-commit "$(git rev-parse HEAD)" --source-tree "$(git rev-parse 'HEAD^{tree}')" --build-set "$PWD/.artifacts/frozen"
      - name: Freeze handoff identities
        id: freeze
        run: |
          set -euo pipefail
          index=.artifacts/frozen/release-index.json
          version=$(cat VERSION)
          test -z "$VERSION" || test "$version" = "$VERSION"
          jq -e --arg version "$version" --arg commit "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            '.publicationEligible == true and .version == $version and .sourceCommit == $commit and .sourceTree == $tree' "$index"
          {
            echo "version=$version"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "index_sha256=$(sha256sum "$index" | cut -d ' ' -f 1)"
            echo "frozen_set_artifact=devkit-frozen-set-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: devkit-frozen-set-${{ github.run_attempt }}
          path: |
            .artifacts/frozen/*.json
            .artifacts/frozen/*.tgz
            .artifacts/frozen/*.tar.gz
            .artifacts/frozen/*.sh
            .artifacts/frozen/*.txt
            .artifacts/frozen/devkit-*
          if-no-files-found: error
          retention-days: 90
      - name: Assemble a separate unpublished host-only Darwin preview
        if: inputs.state == 'fresh'
        id: preview
        env:
          AMD64: ${{ fromJSON(inputs.amd64).contribution_sha256 }}
          ARM64: ${{ fromJSON(inputs.arm64).contribution_sha256 }}
          DARWIN: ${{ fromJSON(inputs.darwin).contribution_sha256 }}
        run: |
          set -euo pipefail
          export DEVKIT_AUTHOR_ENGINE="$PWD/.artifacts/amd64/devkit-x86_64-unknown-linux-musl"
          make pack-local output="$PWD/.artifacts/preview" npm_inputs="$PWD/.artifacts/npm-inputs" \
            target_inputs="x86_64-unknown-linux-musl:.artifacts/amd64:$AMD64 aarch64-unknown-linux-musl:.artifacts/arm64:$ARM64 aarch64-apple-darwin:.artifacts/darwin:$DARWIN" build_run="$BUILD_RUN"
          jq -e '.publicationEligible == false and (.engines | length) == 3' .artifacts/preview/release-index.json
          echo "preview_artifact=devkit-darwin-preview-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "preview_index_sha256=$(sha256sum .artifacts/preview/release-index.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.state == 'fresh'
        with:
          include-hidden-files: true
          name: devkit-darwin-preview-${{ github.run_attempt }}
          path: |
            .artifacts/preview/*.json
            .artifacts/preview/*.tgz
            .artifacts/preview/*.tar.gz
            .artifacts/preview/*.sh
            .artifacts/preview/*.txt
            .artifacts/preview/devkit-*
          if-no-files-found: error
          retention-days: 90
