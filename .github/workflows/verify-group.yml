name: Verify native consumer group

on:
  workflow_call:
    inputs:
      frozen:
        required: true
        type: string
      native:
        required: true
        type: string
      platform:
        required: true
        type: string
      group:
        required: true
        type: string
      checkout_artifact:
        required: false
        type: string
      checkout_sha256:
        required: false
        type: string
      legacy_checkout_artifact:
        required: false
        type: string
      legacy_checkout_sha256:
        required: false
        type: string

permissions:
  contents: read

jobs:
  worker:
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ fromJSON(inputs.frozen).source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/verify-frozen
        with:
          version: ${{ fromJSON(inputs.frozen).version }}
          source_commit: ${{ fromJSON(inputs.frozen).source_commit }}
          source_tree: ${{ fromJSON(inputs.frozen).source_tree }}
          index_sha256: ${{ fromJSON(inputs.frozen).index_sha256 }}
          frozen_set_artifact: ${{ fromJSON(inputs.frozen).frozen_set_artifact }}
          platform: ${{ inputs.platform }}
          need_baseline: ${{ inputs.group == 'delivery' || (inputs.platform == 'amd64' && (inputs.group == 'packaged' || inputs.group == 'registry')) }}
          controller_artifact: ${{ fromJSON(inputs.native).controller_artifact }}
          controller_sha256: ${{ fromJSON(inputs.native).controller_sha256 }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.group == 'delivery' && inputs.platform == 'arm64'
        with:
          name: ${{ inputs.legacy_checkout_artifact }}
          path: .artifacts/legacy-handoff
      - name: Verify v0.5.1 checkout diagnostics on Linux ARM64
        if: inputs.group == 'delivery' && inputs.platform == 'arm64'
        env:
          LEGACY_SHA256: ${{ inputs.legacy_checkout_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum .artifacts/legacy-handoff/legacy.bundle | cut -d ' ' -f 1)" = "$LEGACY_SHA256"
          python3 test/bootstrap/legacy_checkout.py verify --release .artifacts/frozen/payload --bundle .artifacts/legacy-handoff/legacy.bundle
      - name: Cache verified consumer pnpm executable
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/docouno/devkit/tools
          key: pnpm-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.env') }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.group == 'runtime' || inputs.group == 'registry'
        with:
          name: ${{ fromJSON(inputs.native).fixtures_artifact }}
          path: .artifacts/author-fixtures
      - name: Verify static black-box fixtures
        if: inputs.group == 'runtime' || inputs.group == 'registry'
        env:
          FIXTURES_SHA256: ${{ fromJSON(inputs.native).fixtures_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum .artifacts/author-fixtures/checksums.txt | cut -d ' ' -f 1)" = "$FIXTURES_SHA256"
          (
            cd .artifacts/author-fixtures
            sha256sum --check checksums.txt
          )
          chmod 755 .artifacts/author-fixtures/runtime_fixture .artifacts/author-fixtures/registry_fixture
      - name: Cache consumer images
        id: consumer_cache
        if: inputs.group == 'runtime' || inputs.group == 'packaged'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .artifacts/cache/consumer-images.tar
          key: ${{ inputs.group == 'packaged' && format('consumer-images-packaged-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('runtime/rust.Dockerfile', 'runtime/desktop.Dockerfile', 'toolchains.env')) || format('consumer-images-runtime-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('runtime/rust.Dockerfile', 'toolchains.env')) }}
      - name: Load cached consumer images
        if: (inputs.group == 'runtime' || inputs.group == 'packaged') && steps.consumer_cache.outputs.cache-hit == 'true'
        env:
          MATRIX_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail
          verify_image() {
            kind=$1
            pin=$(sha256sum "runtime/$kind.Dockerfile" | cut -d ' ' -f 1)
            test "$(docker image inspect --format "{{.Os}}/{{.Architecture}} {{index .Config.Labels \"io.docouno.devkit.platform\"}} {{index .Config.Labels \"io.docouno.devkit.$kind-recipe\"}}" "devkit-derived-$kind:$ARCH-$pin")" = "linux/$ARCH linux/$ARCH $pin"
          }
          docker load --input .artifacts/cache/consumer-images.tar
          verify_image rust
          if test "$MATRIX_GROUP" = packaged; then
            verify_image desktop
          fi
      - name: Prepare pinned consumer Node image
        run: |
          set -euo pipefail
          img=$(sed -n 's/^DEVKIT_NODE_IMAGE=//p' toolchains.env)
          test -n "$img"
          docker image inspect "$img" >/dev/null 2>&1 || docker pull "$img"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.group == 'packaged' && inputs.platform == 'arm64'
        with:
          name: ${{ inputs.checkout_artifact }}
          path: .artifacts/handoff
      - name: Verify the selected canonical Make group
        env:
          PLATFORM: ${{ inputs.platform }}
          MATRIX_GROUP: ${{ inputs.group }}
          CHECKOUT_SHA256: ${{ inputs.checkout_sha256 }}
        run: |
          set -euo pipefail
          case "$MATRIX_GROUP" in
            runtime|delivery) VERIFY_TARGET="verify-$MATRIX_GROUP-gates" ;;
            packaged|registry) VERIFY_TARGET="verify-$MATRIX_GROUP" ;;
            *) exit 1 ;;
          esac
          extra=()
          if test "$PLATFORM" = amd64 && { test "$MATRIX_GROUP" = delivery || test "$MATRIX_GROUP" = packaged || test "$MATRIX_GROUP" = registry; }; then
            extra+=(previous="$PWD/.artifacts/baseline/v0.5.1/payload" baseline_set="$PWD/.artifacts/baseline/v0.5.1")
          elif test "$MATRIX_GROUP" = delivery; then
            extra+=(baseline_set="$PWD/.artifacts/baseline/v0.5.1")
          fi
          if test "$MATRIX_GROUP" = packaged && test "$PLATFORM" = arm64; then
            test "$(sha256sum .artifacts/handoff/checkout.bundle | cut -d ' ' -f 1)" = "$CHECKOUT_SHA256"
            export DEVKIT_VERIFY_IMPORT_CHECKOUT="$PWD/.artifacts/handoff/checkout.bundle"
          fi
          if test "$MATRIX_GROUP" = runtime || test "$MATRIX_GROUP" = registry; then
            extra+=(fixtures="$PWD/.artifacts/author-fixtures")
          fi
          make "$VERIFY_TARGET" \
            build_set="$PWD/.artifacts/frozen" \
            release="$PWD/.artifacts/frozen/payload" \
            "${extra[@]}"
      - name: Stage consumer images for cache
        if: (inputs.group == 'runtime' || inputs.group == 'packaged') && steps.consumer_cache.outputs.cache-hit != 'true'
        env:
          MATRIX_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail
          umask 022
          images=()
          verify_and_add() {
            kind=$1
            pin=$(sha256sum "runtime/$kind.Dockerfile" | cut -d ' ' -f 1)
            tag="devkit-derived-$kind:$ARCH-$pin"
            test "$(docker image inspect --format "{{.Os}}/{{.Architecture}} {{index .Config.Labels \"io.docouno.devkit.platform\"}} {{index .Config.Labels \"io.docouno.devkit.$kind-recipe\"}}" "$tag")" = "linux/$ARCH linux/$ARCH $pin"
            images+=("$tag")
          }
          verify_and_add rust
          if test "$MATRIX_GROUP" = packaged; then
            verify_and_add desktop
          fi
          mkdir -p .artifacts/cache
          docker save --output .artifacts/cache/consumer-images.tar "${images[@]}"
      - name: Preserve group diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: verify-${{ inputs.group }}-${{ inputs.platform }}-${{ github.run_attempt }}
          path: |
            .artifacts/**/receipt.json
            .artifacts/**/*.log
          retention-days: 90
          if-no-files-found: warn
