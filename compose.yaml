services:
  author:
    image: ${DEVKIT_NODE_IMAGE:?}
    user: ${DEVKIT_UID:?}:${DEVKIT_GID:?}
    init: true
    network_mode: bridge
    working_dir: /workspace
    environment:
      npm_config_cache: /workspace/.artifacts/npm-cache
      npm_config_userconfig: /dev/null
      npm_config_update_notifier: 'false'
      npm_config_fund: 'false'
      npm_config_audit: 'false'
    labels:
      io.docouno.devkit.invocation: ${DEVKIT_INVOCATION_TOKEN:?}
    volumes:
      - type: bind
        source: ${DEVKIT_AUTHOR_ROOT:?}
        target: /workspace
        bind:
          selinux: z
