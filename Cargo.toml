[workspace]
members = ["crates/devkit"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

# Integration tests repeatedly verify the SHA-256 of debug executables.
[profile.test.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
